name: Android Build — APK Validation

# Aura Stories APK build ve doğrulama hattı.
# Next.js static export → Capacitor sync → assembleDebug → APK verify.
# Her push ve PR'da çalışır.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Root typecheck
        run: npx tsc --noEmit

      - name: Root production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || 'ci-dummy' }}
          NEXT_PUBLIC_ADMOB_MODE: simulation
          NEXT_PUBLIC_ENABLE_REWARDED_ADS: false
          NEXT_PUBLIC_ENABLE_VIP: false
          NEXT_PUBLIC_ENABLE_FULL_ACCESS_PURCHASE: false

      - name: Functions typecheck
        run: npm --prefix functions run typecheck

      - name: Functions build
        run: npm --prefix functions run build

      - name: Functions unit tests
        run: npm --prefix functions test

      - name: Firebase emulator rules tests
        run: npm run test:rules

      - name: Firebase emulator economy integration tests
        run: npm run test:economy:integration

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::Root has high/critical vulnerabilities — see audit report"
          npm --prefix functions audit --omit=dev --audit-level=high

      - name: Verify build output
        run: |
          ls -la out/ | head -20
          [ -f out/index.html ] || { echo "✗ out/index.html bulunamadı"; exit 1; }
          echo "✓ Static export başarılı"

      - name: Sync Capacitor Android project
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK_PATH" ] || { echo "✗ APK bulunamadı"; exit 1; }
          echo "✓ APK build başarılı — $(du -h "$APK_PATH" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
