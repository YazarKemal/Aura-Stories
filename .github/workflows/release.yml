name: Release AAB — Google Play Kapalı Test

# Aura Stories imzalı Android App Bundle üretim hattı.
# YALNIZCA manuel dispatch veya v* tag ile tetiklenir.
# pull_request event'inde ÇALIŞMAZ — signing secret'ları korunur.
#
# Kullanılan GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 kodlu .jks/.keystore dosyası
#   ANDROID_KEYSTORE_PASSWORD — keystore şifresi
#   ANDROID_KEY_ALIAS         — anahtar alias'ı
#   ANDROID_KEY_PASSWORD      — anahtar şifresi
#
#   NEXT_PUBLIC_FIREBASE_API_KEY        — Firebase yapılandırması
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#
# GÜVENLİK:
# - NEXT_PUBLIC_DEEPSEEK_API_KEY KULLANILMAZ (Firebase Functions proxy)
# - Keystore iş sonunda silinir
# - Secret değerleri ASLA echo edilmez
# - pull_request trigger'ı YOK (secret erişimi engellenir)
# - google-services.json zorunlu DEĞİL (Firebase JS SDK kullanılıyor)
#   Native Android SDK (FCM/Crashlytics) gerekirse dosya ayrıca eklenmeli

on:
  # Yalnızca version tag'leri ve manuel tetikleme — push/main YOK
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (örn. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code — benzersiz ve artan tam sayı (örn. 1)'
        required: true
        default: '1'

jobs:
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull_request'te ASLA çalışmaz — signing secret'ları korunur
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set version from input or tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            echo "versionName=${{ github.event.inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "versionCode=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "versionName=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "versionName=1.0.0" >> "$GITHUB_OUTPUT"
            echo "versionCode=1" >> "$GITHUB_OUTPUT"
          fi
          echo "✓ versionName=$versionName versionCode=$versionCode"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export → out/)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # DeepSeek API key bilerek ATLANDI — çağrılar Firebase Functions üzerinden gider
          NEXT_PUBLIC_ADMOB_MODE: production
          NEXT_PUBLIC_ENABLE_REWARDED_ADS: false
          NEXT_PUBLIC_ENABLE_VIP: false
          NEXT_PUBLIC_ENABLE_FULL_ACCESS_PURCHASE: false

      - name: Verify build output
        run: |
          [ -f out/index.html ] || { echo "✗ out/index.html bulunamadı"; exit 1; }
          echo "✓ Static export başarılı"

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Inject Android version into build.gradle
        working-directory: android
        run: |
          VCODE="${{ steps.version.outputs.versionCode }}"
          VNAME="${{ steps.version.outputs.versionName }}"
          echo "Injecting versionCode=$VCODE versionName=$VNAME"
          # versionCode NNN → yeni değer
          sed -i "s/versionCode [0-9]\+/versionCode ${VCODE}/" app/build.gradle
          # versionName "X.Y.Z" → yeni değer
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VNAME}\"/" app/build.gradle
          echo "✓ app/build.gradle güncellendi"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "✗ ANDROID_KEYSTORE_BASE64 secret'i tanımlanmamış."
            echo "  GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "✓ Keystore decode edildi"

      - name: Verify signing secrets
        run: |
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "✗ Eksik secret'lar:$missing"
            echo "  GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ Tüm signing secret'ları mevcut"

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew bundleRelease

      - name: Verify AAB
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "✓ Release AAB başarıyla oluşturuldu"
            echo "  Yol: $AAB_PATH"
            echo "  Boyut: $(du -h "$AAB_PATH" | cut -f1)"
            echo "  versionName: ${{ steps.version.outputs.versionName }}"
            echo "  versionCode: ${{ steps.version.outputs.versionCode }}"
          else
            echo "✗ AAB bulunamadı: $AAB_PATH"
            echo "  Çıktı dizini içeriği:"
            find android/app/build/outputs/bundle -type f 2>/dev/null || echo "  (dizin yok)"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          echo "✓ Keystore temizlendi"
